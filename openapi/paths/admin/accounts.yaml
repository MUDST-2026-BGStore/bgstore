get:
  tags:
    - Staff Assignments
  operationId: searchAccounts
  summary: List onboarded accounts, optionally filtered by name or phone
  description:
    One result per identity. Blank or single-character queries list the first page of onboarded
    accounts; at most 20 results.
  security:
    - sessionCookie: []
  x-access-policy: administrator
  parameters:
    - name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/AccountMatchList.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
