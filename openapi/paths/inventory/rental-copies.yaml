parameters:
  - $ref: ../../components/parameters/BranchId.yaml
  - $ref: ../../components/parameters/GameId.yaml
get:
  tags:
    - Inventory
  operationId: listRentalCopies
  summary: List individually tracked rental copies
  security:
    - sessionCookie: []
  x-access-policy: branch-operator
  parameters:
    - $ref: ../../components/parameters/Limit.yaml
    - $ref: ../../components/parameters/Cursor.yaml
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RentalCopyPage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
post:
  tags:
    - Inventory
  operationId: createRentalCopy
  summary: Register a physical rental copy at this branch
  description:
    The asset code must be unique within the branch. A copy cannot simultaneously belong to
    sale stock or another branch.
  security:
    - sessionCookie: []
  x-access-policy: branch-operator
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CreateRentalCopyRequest.yaml
  responses:
    '201':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RentalCopy.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
