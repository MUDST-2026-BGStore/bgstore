parameters:
  - $ref: ../../components/parameters/BranchId.yaml
post:
  tags:
    - Orders
  operationId: createStaffOrder
  summary: Record a counter sale for a registered customer or guest
  description:
    Creates a PLACED order with source=STAFF_COUNTER and creator from the authenticated
    operator. Apply the same atomic stock holds, offering and locked-price rules as customer orders.
    Staff must separately fulfill the order after handing over the games.
  security:
    - sessionCookie: []
  x-access-policy: branch-operator
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
    - $ref: ../../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CreateStaffOrderRequest.yaml
  responses:
    '201':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Order.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
