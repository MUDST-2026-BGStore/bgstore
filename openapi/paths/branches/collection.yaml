get:
  tags:
    - Branches
  operationId: listBranches
  summary: List active store branches
  security: []
  x-access-policy: public
  parameters:
    - $ref: ../../components/parameters/Limit.yaml
    - $ref: ../../components/parameters/Cursor.yaml
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/BranchPage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
post:
  tags:
    - Branches
  operationId: createBranch
  summary: Create a branch
  security:
    - sessionCookie: []
  x-access-policy: administrator
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CreateBranchRequest.yaml
  responses:
    '201':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Branch.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
