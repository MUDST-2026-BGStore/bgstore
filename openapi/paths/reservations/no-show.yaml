parameters:
  - $ref: ../../components/parameters/BranchId.yaml
  - $ref: ../../components/parameters/ReservationId.yaml
post:
  tags:
    - Reservations
  operationId: markReservationNoShow
  summary: Staff-only release of a missed reservation
  description:
    Only CONFIRMED -> NO_SHOW is allowed, and only at or after startsAt. Never automatic
    just because a customer has not self-reported arrival. Release allocations and unserved pre-order
    stock, void card authorizations and unpaid PromptPay payments, and record the staff actor and server
    timestamp. Received PromptPay payments remain CAPTURED; marking a no-show does not issue a refund
    or classify the payment as forfeited. Pending PromptPay charges are refreshed to account for delayed
    payment notifications. Repeating NO_SHOW returns the same reservation without releasing stock again;
    other states return 409.
  security:
    - sessionCookie: []
  x-access-policy: branch-operator
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ReasonRequest.yaml
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Reservation.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '402':
      $ref: ../../components/responses/PaymentDeclined.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '502':
      $ref: ../../components/responses/PaymentGatewayError.yaml
