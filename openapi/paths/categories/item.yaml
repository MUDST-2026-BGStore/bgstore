parameters:
  - $ref: ../../components/parameters/CategoryId.yaml
get:
  tags:
    - Taxonomy
  operationId: getCategory
  summary: Get one category with localized names
  security: []
  x-access-policy: public
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Category.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
patch:
  tags:
    - Taxonomy
  operationId: updateCategory
  summary: Update a category's localized names
  description: >-
    Replaces the localized name map wholesale; the canonical name is immutable.
    Updating games' category membership uses the game endpoints.
  security:
    - sessionCookie: []
  x-access-policy: catalog-manager
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/UpdateCategoryRequest.yaml
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Category.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
