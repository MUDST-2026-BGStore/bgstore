parameters:
  - $ref: ../../components/parameters/CartId.yaml
  - $ref: ../../components/parameters/CartToken.yaml
post:
  tags:
    - Carts
  operationId: checkoutCart
  summary: Place an order from a cart
  description: >-
    Validates every line atomically against the fulfillment location, holds
    stock (branch_editions stock_held), settles how the total is paid (CARD
    authorizes the payment token; PROMPTPAY returns a QR payable for 15
    minutes; COD waits for cash at delivery), creates one PLACED order and
    marks the cart CONVERTED; the cart keeps
    its lines and cannot be reused. A declined payment returns 402 and leaves the
    cart open with nothing held. Requires
    Idempotency-Key. Replays with the same key and body return the original
    order. Guests require X-Cart-Token; signed-in accounts may also check out
    a guest cart they hold. 409 when the cart is empty, has issues, is not
    OPEN, or any line no longer has enough stock.
  security: []
  x-access-policy: public
  parameters:
    - $ref: ../../components/parameters/CsrfToken.yaml
    - $ref: ../../components/parameters/IdempotencyKey.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CheckoutCartRequest.yaml
  responses:
    '201':
      description: Order placed from the cart
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/Order.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '402':
      $ref: ../../components/responses/PaymentDeclined.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '409':
      $ref: ../../components/responses/Conflict.yaml
    '502':
      $ref: ../../components/responses/PaymentGatewayError.yaml
