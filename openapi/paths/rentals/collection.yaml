parameters:
  - $ref: ../../components/parameters/BranchId.yaml
get:
  tags:
    - Rentals
  operationId: listBranchRentals
  summary: List active and completed hourly rentals for staff
  security:
    - sessionCookie: []
  x-access-policy: branch-operator
  parameters:
    - $ref: ../../components/parameters/Limit.yaml
    - $ref: ../../components/parameters/Cursor.yaml
    - name: status
      in: query
      required: false
      description: Filter by lifecycle status.
      schema:
        $ref: ../../components/schemas/RentalStatus.yaml
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/RentalPage.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
