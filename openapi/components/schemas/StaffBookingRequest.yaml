type: object
description: >-
  Staff booking on behalf of a registered customer or guest; startsAt must be in
  the future.
additionalProperties: false
required:
  - source
  - customer
  - tableId
  - startsAt
  - endsAt
  - partySize
  - games
properties:
  source:
    type: string
    enum:
      - STAFF_BOOKING
  customer:
    $ref: ./CustomerReference.yaml
  tableId:
    type: string
    format: uuid
  startsAt:
    type: string
    format: date-time
  endsAt:
    type: string
    format: date-time
  partySize:
    type: integer
    format: int32
    minimum: 1
  games:
    type: array
    items:
      $ref: ./GameSelection.yaml
    maxItems: 50
    description: >-
      One entry per game ID. Empty means table-only booking. Quantities reserve
      physical copies, not sale stock.
  notes:
    type: string
    maxLength: 1000
