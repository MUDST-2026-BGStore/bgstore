type: object
description: Only administrators may create branches. Opening periods must not overlap.
additionalProperties: false
required:
  - name
  - address
  - openingHours
  - active
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  address:
    type: string
    minLength: 1
    maxLength: 500
  phone:
    type: string
    minLength: 1
    maxLength: 40
  openingHours:
    type: array
    items:
      $ref: ./OpeningPeriod.yaml
    maxItems: 28
  active:
    type: boolean
