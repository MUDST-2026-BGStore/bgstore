type: object
description: >-
  startsAt is assigned from server time; endsAt must be later. A separate staff
  check-in is required.
additionalProperties: false
required:
  - source
  - customer
  - tableId
  - endsAt
  - partySize
  - games
properties:
  source:
    type: string
    enum:
      - WALK_IN
  customer:
    $ref: ./CustomerReference.yaml
  tableId:
    type: string
    format: uuid
  endsAt:
    type: string
    format: date-time
  partySize:
    type: integer
    format: int32
    minimum: 1
  games:
    type: array
    items:
      $ref: ./GameSelection.yaml
    maxItems: 50
    description: >-
      One entry per game ID. Empty means table-only booking. Quantities reserve
      physical copies, not sale stock.
  notes:
    type: string
    maxLength: 1000
