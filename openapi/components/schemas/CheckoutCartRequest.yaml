type: object
description: >-
  Checkout details. Guests must supply contact with name, email and phone;
  signed-in callers may omit it to use their account profile and sign-in email.
  shippingAddress is required when the cart ships and rejected when it is
  picked up. paymentMethod defaults to CARD; paymentToken is required for
  CARD, where it is authorized for the server-calculated total, and rejected
  otherwise. Guests may only pay by CARD.
additionalProperties: false
properties:
  contact:
    $ref: ./OrderContact.yaml
  shippingAddress:
    $ref: ./ShippingAddress.yaml
  notes:
    type: string
    maxLength: 1000
  paymentMethod:
    $ref: ./PaymentMethodChoice.yaml
  paymentToken:
    type: string
    minLength: 16
    maxLength: 128
