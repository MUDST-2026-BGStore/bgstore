type: object
description: Partial table update; at least one property is required.
additionalProperties: false
properties:
  label:
    type: string
    description: Unique table label within the branch.
    minLength: 1
    maxLength: 80
  capacity:
    type: integer
    format: int32
    minimum: 1
  hourlyRate:
    $ref: ./Money.yaml
  operationalStatus:
    type: string
    enum:
      - IN_SERVICE
      - OUT_OF_SERVICE
minProperties: 1
