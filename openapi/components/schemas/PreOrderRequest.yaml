type: object
description: >-
  Food and drink ordered ahead with a reservation, one line per menu item. The
  server prices the lines, applies the pre-order discount, holds the stock at
  the branch. CARD requires paymentToken and authorizes the food total; PROMPTPAY
  requires no token and includes food in the reservation's upfront QR charge.
additionalProperties: false
required:
  - items
properties:
  items:
    type: array
    items:
      $ref: ./PreOrderItemRequest.yaml
    minItems: 1
    maxItems: 40
  paymentToken:
    type: string
    description: Single-use token from the payment token operation.
    minLength: 16
    maxLength: 128
