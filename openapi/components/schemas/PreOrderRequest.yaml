type: object
description: >-
  Food and drink ordered ahead with a reservation, one line per menu item. The
  server prices the lines, applies the pre-order discount, holds the stock at
  the branch and authorizes the payment token for the total.
additionalProperties: false
required:
  - items
  - paymentToken
properties:
  items:
    type: array
    items:
      $ref: ./PreOrderItemRequest.yaml
    minItems: 1
    maxItems: 40
  paymentToken:
    type: string
    description: Single-use token from the payment token operation.
    minLength: 16
    maxLength: 128
