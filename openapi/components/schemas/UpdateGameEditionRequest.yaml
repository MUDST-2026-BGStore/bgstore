type: object
description: Partial edition update; at least one property is required.
additionalProperties: false
properties:
  editionKind:
    type: string
    enum:
      - BASE_GAME
      - EXPANSION
  languageCode:
    type: string
    minLength: 1
    maxLength: 35
    description: IETF language tag of this edition's components, e.g. en or th.
  active:
    type: boolean
minProperties: 1
