type: object
description: maxPlayers must be at least minPlayers.
additionalProperties: false
required:
  - name
  - minPlayers
  - maxPlayers
  - playMinutesMin
  - playMinutesMax
  - active
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
  designer:
    type: string
    maxLength: 200
  difficulty:
    $ref: ./Difficulty.yaml
  categories:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 100
    maxItems: 12
    minItems: 1
  mechanics:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 100
    maxItems: 12
  minPlayers:
    type: integer
    format: int32
    minimum: 1
  maxPlayers:
    type: integer
    format: int32
    minimum: 1
  minAge:
    type: integer
    format: int32
    minimum: 0
  playMinutesMin:
    type: integer
    format: int32
    minimum: 1
  playMinutesMax:
    type: integer
    format: int32
    minimum: 1
  teachMinutes:
    type: integer
    format: int32
    minimum: 0
  setupMinutes:
    type: integer
    format: int32
    minimum: 0
  descriptions:
    type: object
    description: Localized descriptions keyed by IETF locale tag.
    additionalProperties:
      type: string
      maxLength: 4000
  images:
    type: array
    items:
      $ref: ./GameImageInput.yaml
  active:
    type: boolean
