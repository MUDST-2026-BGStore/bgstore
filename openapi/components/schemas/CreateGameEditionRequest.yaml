type: object
description: One edition per (game, kind, languageCode); duplicates return 409.
additionalProperties: false
required:
  - editionKind
  - languageCode
  - active
properties:
  editionKind:
    type: string
    enum:
      - BASE_GAME
      - EXPANSION
  languageCode:
    type: string
    minLength: 1
    maxLength: 35
    description: IETF language tag of this edition's components, e.g. en or th.
    example: th
  active:
    type: boolean
