type: object
description: >-
  All prices are THB minor units; total is subtotal plus shippingFee. An
  order cannot contain rental copies. FULFILLED requires fulfilledAt and
  fulfilledBySubject. CANCELLED requires cancelledAt, cancelledBySubject and
  cancellationReason. Those fields are omitted before the corresponding
  transition.
required:
  - id
  - branchId
  - customer
  - source
  - status
  - items
  - subtotal
  - shippingFee
  - total
  - contact
  - fulfillmentMethod
  - payment
  - createdAt
  - createdBySubject
properties:
  id:
    type: string
    format: uuid
  branchId:
    type: string
    format: uuid
  customer:
    $ref: ./CustomerReference.yaml
  source:
    type: string
    enum:
      - CUSTOMER
      - STAFF_COUNTER
  status:
    $ref: ./OrderStatus.yaml
  items:
    type: array
    items:
      $ref: ./OrderItem.yaml
    minItems: 1
  subtotal:
    $ref: ./Money.yaml
  shippingFee:
    $ref: ./Money.yaml
  total:
    $ref: ./Money.yaml
  contact:
    $ref: ./OrderContact.yaml
  fulfillmentMethod:
    type: string
    description: PICKUP orders are handed over at branchId; SHIPPING orders are sent from it, the delivery branch.
    enum:
      - PICKUP
      - SHIPPING
  shippingAddress:
    $ref: ./ShippingAddress.yaml
  carrier:
    type: string
    enum:
      - THAILAND_POST
      - KERRY
      - FLASH
      - JT
  trackingNumber:
    type: string
    maxLength: 60
  payment:
    $ref: ./OrderPayment.yaml
  notes:
    type: string
  createdAt:
    type: string
    format: date-time
  createdBySubject:
    type: string
  fulfilledAt:
    type: string
    format: date-time
  fulfilledBySubject:
    type: string
  cancelledAt:
    type: string
    format: date-time
  cancelledBySubject:
    type: string
  cancellationReason:
    type: string
