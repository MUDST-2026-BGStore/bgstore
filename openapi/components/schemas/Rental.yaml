type: object
description: >-
  total is present only when COMPLETED and is the sum of hourly charge line totals
  and served refreshment line totals. Refreshments are one-time charges, independent
  of billable hours. The
  owning customer may view the result but cannot start or end the rental.
  COMPLETED requires endedAt, checkedOutBySubject, billableHours, total and
  billableHours/lineTotal on every charge. ACTIVE omits those completion fields.
required:
  - id
  - branchId
  - reservationId
  - tableId
  - customer
  - status
  - startedAt
  - plannedEndsAt
  - serverNow
  - checkedInBySubject
  - charges
properties:
  id:
    type: string
    format: uuid
  branchId:
    type: string
    format: uuid
  reservationId:
    type: string
    format: uuid
  tableId:
    type: string
    format: uuid
  customer:
    $ref: ./CustomerReference.yaml
  status:
    $ref: ./RentalStatus.yaml
  startedAt:
    type: string
    description: Actual check-in time from the server clock.
    format: date-time
  plannedEndsAt:
    type: string
    description: Reservation end; passing it does not release the table or copies.
    format: date-time
  serverNow:
    type: string
    description: >-
      Server clock when this response was produced (UTC instant). Clients derive
      elapsed and remaining play time from it, not from the device clock.
    format: date-time
  checkedInBySubject:
    type: string
  charges:
    type: array
    items:
      $ref: ./RentalCharge.yaml
    minItems: 1
  refreshments:
    type: array
    description: Served refreshments, retained after checkout; empty when none were ordered.
    items:
      $ref: ./RentalRefreshment.yaml
  endedAt:
    type: string
    description: Server checkout time; present when COMPLETED.
    format: date-time
  checkedOutBySubject:
    type: string
    description: Present when COMPLETED.
  billableHours:
    type: integer
    format: int32
    minimum: 1
    description: >-
      Present when COMPLETED; ceil actual elapsed hours, minimum one. An upfront
      paid reservation has a minimum of its booked hours, including early departures.
  prepaid:
    description: >-
      Captured upfront table/game credit. Food pre-orders are paid separately and
      excluded from rental total and this credit.
    allOf:
      - $ref: ./Money.yaml
  balanceDue:
    description: >-
      Present when COMPLETED; rental total less prepaid table/game credit. Later
      refreshments and play beyond the booked hours remain payable at the counter.
    allOf:
      - $ref: ./Money.yaml
  total:
    $ref: ./Money.yaml
