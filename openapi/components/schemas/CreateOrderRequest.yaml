type: object
description: One line per edition ID; prices and lifecycle fields are server-controlled.
additionalProperties: false
required:
  - items
  - paymentToken
properties:
  items:
    type: array
    items:
      $ref: ./OrderItemRequest.yaml
    minItems: 1
    maxItems: 50
  notes:
    type: string
    maxLength: 1000
  paymentToken:
    type: string
    description: Single-use token from the payment token operation; authorized for the server-calculated total.
    minLength: 16
    maxLength: 128
