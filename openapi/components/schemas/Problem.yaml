type: object
required:
  - status
  - code
  - message
properties:
  status:
    type: integer
    format: int32
    minimum: 400
    maximum: 599
  code:
    type: string
    description: Stable machine-readable error code.
    example: TABLE_UNAVAILABLE
  message:
    type: string
    description: Human-readable error detail.
  fieldErrors:
    type: array
    items:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
