type: object
description: Partial branch update; at least one property is required.
additionalProperties: false
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  address:
    type: string
    minLength: 1
    maxLength: 500
  phone:
    type: string
    minLength: 1
    maxLength: 40
  openingHours:
    type: array
    items:
      $ref: ./OpeningPeriod.yaml
    maxItems: 28
  active:
    type: boolean
  fulfillsDelivery:
    type: boolean
    description: Whether this branch ships delivery orders. At most one branch does; claiming it while another branch holds it returns 409.
minProperties: 1
