type: object
description: >-
  How the order is paid. CARD is authorized at placement, captured at
  fulfillment and voided on cancellation. COUNTER sales are settled at the
  counter: PENDING until handover, then CAPTURED. PROMPTPAY is PENDING with a
  QR (promptPayQr) until the customer pays it, then CAPTURED; unpaid at
  expiresAt, the order is cancelled and the payment VOIDED. COD (cash on
  delivery) stays PENDING through dispatch until staff confirm the cash was
  received. Only the card brand and last four digits are ever kept.
required:
  - method
  - status
  - amount
properties:
  method:
    type: string
    enum:
      - CARD
      - COUNTER
      - PROMPTPAY
      - COD
  status:
    type: string
    enum:
      - PENDING
      - AUTHORIZED
      - CAPTURED
      - VOIDED
  amount:
    $ref: ./Money.yaml
  cardBrand:
    $ref: ./CardBrand.yaml
  cardLast4:
    type: string
    pattern: ^[0-9]{4}$
  promptPayQr:
    type: string
    description: >-
      Image URL (https or data) of the PromptPay QR to show the customer. Only
      present while a PROMPTPAY payment is PENDING.
    maxLength: 2000000
  expiresAt:
    type: string
    format: date-time
    description: When an unpaid PROMPTPAY QR stops being payable. Only present while PENDING.
