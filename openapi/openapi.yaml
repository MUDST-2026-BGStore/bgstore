tags:
  - name: Authentication
    description: Existing browser session and CSRF endpoints.
  - name: Wiring
    description: Existing connectivity checks.
  - name: Account
    description: Existing authenticated profiles.
  - name: Branches
    description: Public branch discovery and administrator maintenance.
  - name: Games
    description: Shared board game catalog.
  - name: Taxonomy
    description: Catalog categories and mechanics with canonical keys and localized display names.
  - name: Editions
    description: Sellable editions of catalog games; the retail SKU for orders, carts and per-branch sale stock.
  - name: Inventory
    description: Branch sale quantities and individually tracked rental copies.
  - name: Carts
    description: Persistent server carts for storefront purchase flows, guest-accessible by one-time token.
  - name: Tables
    description: Branch tables and live occupancy.
  - name: Availability
    description: Time-window availability before booking.
  - name: Reservations
    description: Customer bookings, staff bookings and walk-ins.
  - name: Rentals
    description: Staff-controlled hourly in-store play sessions.
  - name: Orders
    description: Branch game sales and staff fulfillment.
  - name: Pantry
    description: Food and drink menu and per-branch pantry stock.
  - name: Payments
    description: Card tokenization for checkout; money moves only through order placement, fulfillment and cancellation.
security: []
