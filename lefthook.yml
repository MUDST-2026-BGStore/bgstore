commit-msg:
  commands:
    conventional-commit:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,mjs,cjs,ts,mts,cts,vue}'
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    prettier:
      glob: '*.{css,html,js,mjs,cjs,json,md,ts,mts,cts,vue,yaml,yml}'
      run: pnpm exec prettier --check {staged_files}
    java:
      glob: '*.{java,gradle.kts}'
      run: ./apps/api/gradlew -p apps/api spotlessCheck

pre-push:
  commands:
    verify:
      run: pnpm check
