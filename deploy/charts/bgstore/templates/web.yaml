apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "bgstore.labels" . | nindent 4 }}
    app.kubernetes.io/name: bgstore-web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels: { app.kubernetes.io/name: bgstore-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bgstore-web, app.kubernetes.io/part-of: bgstore }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: {{ include "bgstore.image" (dict "Values" .Values "component" "web") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsUser: 101
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: bgstore-web, app.kubernetes.io/part-of: bgstore }
spec:
  selector: { app.kubernetes.io/name: bgstore-web }
  ports:
    - { name: http, port: 80, targetPort: http }
