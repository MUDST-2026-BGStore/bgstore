{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bgstore-api
  labels: { app.kubernetes.io/part-of: bgstore }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: bgstore-api } }
  endpoints:
    - { port: http, path: /actuator/prometheus, interval: 30s }
{{- end }}
