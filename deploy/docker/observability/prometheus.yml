global:
  scrape_interval: 15s
scrape_configs:
  - job_name: theparlor-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8080']
  - job_name: theparlor-api-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
