server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  # Compose uses nginx for same-origin API routing; Kubernetes ingress routes /api directly.
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $http_host; }
  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control 'no-store'; }
}
