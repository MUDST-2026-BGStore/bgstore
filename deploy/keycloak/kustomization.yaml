apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-theparlor.json
  - name: keycloak-login-theme
    files:
      - theme.properties=themes/theparlor/login/theme.properties
      - footer.ftl=themes/theparlor/login/footer.ftl
      - login-reset-password.ftl=themes/theparlor/login/login-reset-password.ftl
      - header.js=themes/theparlor/login/resources/js/header.js
      - fc-mee-sakul.ttf=themes/theparlor/login/resources/fonts/fc-mee-sakul.ttf
      - parlor.css=themes/theparlor/login/resources/css/parlor.css
      - favicon.svg=themes/theparlor/login/resources/img/favicon.svg
      - card-fan.svg=themes/theparlor/login/resources/img/card-fan.svg
      - messages_en.properties=themes/theparlor/login/messages/messages_en.properties
      - messages_th.properties=themes/theparlor/login/messages/messages_th.properties
labels:
  - pairs:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: theparlor
