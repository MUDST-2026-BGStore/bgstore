---
- name: Configure a single schedulable k3s server and Argo CD
  hosts: k3s_servers
  become: true
  gather_facts: true
  handlers:
    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: restarted
        daemon_reload: true

  tasks:
    - name: Wait for cloud-init to finish before using the package manager
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300

    - name: Require the observed Amazon Linux platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Amazon'
          - ansible_facts.distribution_major_version == '2023'
          - ansible_facts.architecture in ['aarch64', 'x86_64']

    - name: Install k3s host prerequisites without a full OS upgrade
      ansible.builtin.dnf:
        name:
          [
            curl-minimal,
            git,
            python3,
            iptables,
            conntrack-tools,
            container-selinux,
          ]
        state: present

    - name: Check installed k3s
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: installed_k3s
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse an implicit k3s version change
      ansible.builtin.assert:
        that:
          - installed_k3s.rc != 0 or k3s_version in installed_k3s.stdout or allow_k3s_upgrade
        fail_msg: Set k3s_version to the installed version or explicitly allow_k3s_upgrade.

    - name: Create private k3s configuration directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /etc/rancher/k3s
        - /etc/rancher/k3s/config.yaml.d
        - /etc/systemd/system/k3s.service.d

    - name: Preserve the previous k3s configuration on first adoption
      ansible.builtin.shell:
        cmd: 'test ! -f /etc/rancher/k3s/config.yaml || cp -p /etc/rancher/k3s/config.yaml /etc/rancher/k3s/config.yaml.before-ansible'
        creates: /etc/rancher/k3s/config.yaml.before-ansible
      changed_when: false

    - name: Configure native ECR image-pull credentials from the EC2 role
      when: enable_ecr_credentials
      block:
        - name: Create the kubelet credential-provider directory
          ansible.builtin.file:
            path: /var/lib/rancher/credentialprovider/bin
            state: directory
            owner: root
            group: root
            mode: '0755'
        - name: Install the verified official AWS credential provider
          ansible.builtin.get_url:
            url: 'https://artifacts.k8s.io/binaries/cloud-provider-aws/{{ ecr_credential_provider_version }}/linux/{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}/ecr-credential-provider-linux-{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}'
            checksum: 'sha256:https://artifacts.k8s.io/binaries/cloud-provider-aws/{{ ecr_credential_provider_version }}/linux/{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}/ecr-credential-provider-linux-{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}.sha256'
            dest: /var/lib/rancher/credentialprovider/bin/ecr-credential-provider
            mode: '0755'
          notify: Restart k3s
        - name: Match private ECR image references
          ansible.builtin.copy:
            dest: /var/lib/rancher/credentialprovider/config.yaml
            owner: root
            group: root
            mode: '0600'
            content: |
              apiVersion: kubelet.config.k8s.io/v1
              kind: CredentialProviderConfig
              providers:
                - name: ecr-credential-provider
                  matchImages:
                    - "*.dkr.ecr.*.amazonaws.com"
                  apiVersion: credentialprovider.kubelet.k8s.io/v1
                  defaultCacheDuration: "10h"
          notify: Restart k3s

    - name: Configure a server with workload scheduling enabled
      ansible.builtin.template:
        src: k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: '0600'
      notify: Restart k3s

    - name: Install EC2 address discovery
      ansible.builtin.copy:
        src: k3s-aws-address.sh
        dest: /usr/local/sbin/k3s-aws-address
        owner: root
        group: root
        mode: '0755'
      notify: Restart k3s

    - name: Use configuration files and refresh AWS addresses on each start
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/20-ansible.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Environment="K3S_FIXED_EXTERNAL_IP={{ k3s_external_ip }}"
          ExecStartPre=/usr/local/sbin/k3s-aws-address
          ExecStart=
          ExecStart=/usr/local/bin/k3s server
      notify: Restart k3s

    - name: Download the pinned k3s installer when installation is needed
      ansible.builtin.get_url:
        url: 'https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh'
        dest: /var/tmp/k3s-install.sh
        mode: '0700'
      when: installed_k3s.rc != 0 or k3s_version not in installed_k3s.stdout

    - name: Install the pinned k3s version without automatically starting it
      ansible.builtin.command: /bin/sh /var/tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: '{{ k3s_version }}'
        INSTALL_K3S_SKIP_START: 'true'
        INSTALL_K3S_EXEC: server
      when: installed_k3s.rc != 0 or k3s_version not in installed_k3s.stdout
      notify: Restart k3s

    - name: Apply k3s configuration before checking Kubernetes
      ansible.builtin.meta: flush_handlers

    - name: Keep k3s enabled and running
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for the API listener after a restart
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 180

    - name: Wait for the single node to be Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      register: node_ready
      until: node_ready.rc == 0
      retries: 6
      delay: 5
      changed_when: false

    - name: Wait for Kubernetes API readiness
      ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
      register: api_ready
      until: api_ready.rc == 0
      retries: 24
      delay: 5
      changed_when: false
      check_mode: false

    - name: Read node scheduling configuration
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes -o json
      register: nodes
      check_mode: false
      changed_when: false

    - name: Read the Kubernetes service endpoint
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n default get endpointslice -l kubernetes.io/service-name=kubernetes -o json
      register: api_endpoint
      changed_when: false
      check_mode: false

    - name: Require the in-cluster API to use the private EC2 interface
      ansible.builtin.assert:
        that:
          - "(api_endpoint.stdout | from_json)['items'] | length == 1"
          - "(api_endpoint.stdout | from_json)['items'][0].endpoints[0].addresses == [ansible_facts.default_ipv4.address]"
        fail_msg: The Kubernetes service must use the private API address so pods can connect without exposing port 6443.

    - name: Require one node and no control-plane scheduling taints
      ansible.builtin.assert:
        that:
          - (nodes.stdout | from_json)['items'] | length == 1
          - not ((nodes.stdout | from_json)['items'][0].spec.unschedulable | default(false))
          - ((nodes.stdout | from_json)['items'][0].spec.taints | default([]) | selectattr('key', 'in', ['node-role.kubernetes.io/control-plane', 'node-role.kubernetes.io/master']) | list | length) == 0
        fail_msg: The single node must be schedulable. Inspect existing taints before changing scheduling policy.

    - name: Mark the control-plane node as a worker through the administrator API
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - label
          - node
          - "{{ (nodes.stdout | from_json)['items'][0].metadata.name }}"
          - node-role.kubernetes.io/worker=true
          - --overwrite
      when: (nodes.stdout | from_json)['items'][0].metadata.labels.get('node-role.kubernetes.io/worker') != 'true'

    - name: Check for an existing Argo CD installation
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd get deployment argocd-server -o name
      register: existing_argocd
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Check Helm availability
      ansible.builtin.command: /usr/local/bin/helm version --short
      register: installed_helm
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Install Helm for a new platform
      when: installed_helm.rc != 0
      block:
        - name: Download a verified Helm archive
          ansible.builtin.get_url:
            url: 'https://get.helm.sh/helm-{{ helm_version }}-linux-{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}.tar.gz'
            checksum: 'sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}.tar.gz.sha256sum'
            dest: /var/tmp/helm.tar.gz
            mode: '0600'
        - name: Extract Helm
          ansible.builtin.unarchive:
            src: /var/tmp/helm.tar.gz
            dest: /var/tmp
            remote_src: true
        - name: Install Helm executable
          ansible.builtin.copy:
            src: '/var/tmp/linux-{{ "arm64" if ansible_facts.architecture == "aarch64" else "amd64" }}/helm'
            dest: /usr/local/bin/helm
            remote_src: true
            mode: '0755'

    - name: Install Argo CD only when absent or an upgrade is explicitly requested
      when: existing_argocd.rc != 0 or allow_argocd_upgrade
      block:
        - name: Copy Argo CD bootstrap settings
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../kubernetes/argocd-values.yaml'
            dest: /var/tmp/argocd-values.yaml
            mode: '0600'
        - name: Install the pinned Argo CD chart
          ansible.builtin.command:
            argv:
              - /usr/local/bin/helm
              - upgrade
              - --install
              - argocd
              - argo-cd
              - --repo
              - https://argoproj.github.io/argo-helm
              - --version
              - '{{ argocd_chart_version }}'
              - --namespace
              - argocd
              - --create-namespace
              - --values
              - /var/tmp/argocd-values.yaml
              - --wait
              - --timeout
              - 10m
          environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Check existing Envoy Gateway
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n envoy-gateway-system get deployment envoy-gateway -o name
      register: existing_envoy
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Bootstrap pinned Envoy Gateway and Gateway API CRDs when absent
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - upgrade
          - --install
          - envoy-gateway
          - oci://docker.io/envoyproxy/gateway-helm
          - --version
          - '{{ envoy_gateway_version }}'
          - --namespace
          - envoy-gateway-system
          - --create-namespace
          - --wait
          - --timeout
          - 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: existing_envoy.rc != 0

    - name: Check existing cert-manager
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n cert-manager get deployment cert-manager -o name
      register: existing_cert_manager
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Bootstrap pinned cert-manager with Gateway API support when absent
      ansible.builtin.command:
        argv:
          - /usr/local/bin/helm
          - upgrade
          - --install
          - cert-manager
          - cert-manager
          - --repo
          - https://charts.jetstack.io
          - --version
          - '{{ cert_manager_version }}'
          - --namespace
          - cert-manager
          - --create-namespace
          - --set
          - crds.enabled=true
          - --set
          - config.gatewayAPI.enabled=true
          - --wait
          - --timeout
          - 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: existing_cert_manager.rc != 0

    - name: Register the new The Parlor GitOps configuration
      when: configure_gitops
      block:
        - name: Copy The Parlor project and applications
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../kubernetes/{{ item }}'
            dest: '/var/tmp/theparlor-{{ item }}'
            mode: '0600'
          loop: [project.yaml, application.yaml]
        - name: Apply the new project and paused manual-sync applications
          ansible.builtin.command: '/usr/local/bin/k3s kubectl apply --server-side --field-manager=theparlor-bootstrap -f /var/tmp/theparlor-{{ item }}'
          register: gitops_apply
          changed_when: "'unchanged' not in gitops_apply.stdout"
          loop: [project.yaml, application.yaml]

    - name: Retire Git references to the previous deployment without deleting workloads
      when: retire_legacy_git_applications
      block:
        - name: Inspect legacy application names
          ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd get applications -o json
          register: argo_applications
          changed_when: false
          check_mode: false
          no_log: true
        - name: Disable old reconciliation and remove deletion finalizers
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - -n
              - argocd
              - patch
              - application
              - '{{ item }}'
              - --type=merge
              - -p
              - '{"metadata":{"finalizers":null},"spec":{"syncPolicy":{"automated":null}}}'
          loop: '{{ legacy_git_applications }}'
          when: item in ((argo_applications.stdout | from_json)['items'] | map(attribute='metadata.name') | list)
        - name: Delete only the retired Application objects
          ansible.builtin.command: '/usr/local/bin/k3s kubectl -n argocd delete application {{ item }} --cascade=orphan --ignore-not-found=true'
          loop: '{{ legacy_git_applications }}'
          register: legacy_delete
          changed_when: "'deleted' in legacy_delete.stdout"

    - name: Wait for Argo CD API readiness
      ansible.builtin.command: /usr/local/bin/k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=180s
      changed_when: false

    - name: Confirm system services and storage
      ansible.builtin.command: /usr/local/bin/k3s kubectl get deployment -n kube-system coredns metrics-server local-path-provisioner
      changed_when: false
