# Existing Argo CD Helm settings, chart 10.9.2 (Argo CD v3.5.3).
# Plain HTTP is used behind the existing TLS-terminating Envoy Gateway.
# Access NodePort administration through SSH; do not open it in the AWS SG.
applicationSet:
  replicaCount: 1
configs:
  params:
    server.insecure: true
controller:
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
global:
  networkPolicy:
    create: false
redis:
  enabled: true
redis-ha:
  enabled: false
repoServer:
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
server:
  service:
    nodePortHttp: 31080
    nodePortHttps: 31443
    type: NodePort
