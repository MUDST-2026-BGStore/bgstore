# These DNS names must resolve to the EC2 public IP before HTTP-01 can succeed.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: admin@chanakanlabs.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-production-account-key }
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: gateway
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: theparlor
  namespace: gateway
spec:
  secretName: theparlor-tls
  dnsNames: [theparlor.43.210.113.14.sslip.io]
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
  namespace: gateway
spec:
  secretName: keycloak-tls
  dnsNames: [auth.43.210.113.14.sslip.io]
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd
  namespace: gateway
spec:
  secretName: argocd-tls
  dnsNames: [argocd.43.210.113.14.sslip.io]
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
