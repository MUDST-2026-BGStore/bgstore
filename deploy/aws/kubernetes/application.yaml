# Published ARM64 images and the existing runtime Secret back this AWS release.
# Sync both applications explicitly in Argo CD; automatic sync/pruning stay off.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theparlor-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: 'false'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: theparlor
  source:
    repoURL: https://github.com/MUDST-2026-BGStore/bgstore.git
    targetRevision: main
    path: deploy/k8s/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: theparlor-dev
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theparlor-routing
  namespace: argocd
  annotations:
    argocd.argoproj.io/skip-reconcile: 'false'
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: theparlor
  source:
    repoURL: https://github.com/MUDST-2026-BGStore/bgstore.git
    targetRevision: main
    path: deploy/aws/kubernetes/routing
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
