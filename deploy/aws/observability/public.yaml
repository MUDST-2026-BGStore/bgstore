# Only the authenticated Grafana UI is public. Data sources and OTLP ingestion
# stay ClusterIP-only. The listener is part of the shared routing source;
# gateway.py safely adds it to an already-deployed Gateway during adoption.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: observe
  namespace: gateway
spec:
  secretName: observe-tls
  dnsNames: [observe.devopsandbox.chanakanlabs.com]
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: observe
  hostnames: [observe.devopsandbox.chanakanlabs.com]
  rules:
    - backendRefs: [{ name: monitoring-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-https-redirect
  namespace: observability
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: http
  hostnames: [observe.devopsandbox.chanakanlabs.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
