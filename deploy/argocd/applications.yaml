apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bgstore
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    # One Application per values file in deploy/environments. The live cluster
    # is the single-node devopsandbox instance, so only dev.yaml exists;
    # adding staging.yaml or production.yaml there later creates its
    # Application automatically. Images are pinned to the exact main commit
    # rendered by the generator (the `main-<sha>` tag built by the
    # trunk-images workflow), so a merge to main deploys itself.
    - git:
        repoURL: https://github.com/MUDST-2026-BGStore/bgstore.git
        revision: main
        directory:
          path: deploy/environments/*.yaml
  template:
    metadata:
      name: 'bgstore-{{ .path.basename }}'
      labels:
        {
          app.kubernetes.io/part-of: bgstore,
          environment: '{{ .path.basename }}',
        }
    spec:
      project: bgstore
      source:
        repoURL: https://github.com/MUDST-2026-BGStore/bgstore.git
        targetRevision: main
        path: deploy/charts/bgstore
        helm:
          valueFiles:
            - '../../environments/{{ .path.basename }}.yaml'
          parameters:
            - name: images.tag
              value: 'main-{{ .revision }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'bgstore-{{ .path.basename }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bgstore
  namespace: argocd
spec:
  description: BGStore application environments
  sourceRepos: [https://github.com/MUDST-2026-BGStore/bgstore.git]
  destinations:
    - { namespace: 'bgstore*', server: https://kubernetes.default.svc }
  clusterResourceWhitelist:
    - { group: '', kind: Namespace }
  namespaceResourceWhitelist:
    - { group: '*', kind: '*' }
