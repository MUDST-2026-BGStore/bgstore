apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bgstore
  namespace: argocd
spec:
  description: BGStore application environments
  sourceRepos: [https://github.com/MUDST-2026-BGStore/bgstore.git]
  destinations:
    - { namespace: 'bgstore*', server: https://kubernetes.default.svc }
  clusterResourceWhitelist:
    - { group: '', kind: Namespace }
  namespaceResourceWhitelist:
    - { group: '*', kind: '*' }
---
# Single live environment (ADR-0008). Dev tracks main and is pinned to the
# trunk-built `main-<sha>` image tag; the trunk-images workflow keeps that tag
# current by opening a pull request that bumps images.tag in
# environments/dev/values.yaml — merging it deploys the build. When a second
# environment exists, reintroduce an ApplicationSet (per-environment directory
# under deploy/environments/) instead of duplicating this manifest by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgstore-dev
  namespace: argocd
  labels: { app.kubernetes.io/part-of: bgstore, environment: dev }
spec:
  project: bgstore
  source:
    repoURL: https://github.com/MUDST-2026-BGStore/bgstore.git
    targetRevision: main
    path: deploy/charts/bgstore
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bgstore-dev
  ignoreDifferences:
    # This k3s apiserver does not persist managedFields, so the ServerSideApply
    # dry-run compare keeps reporting the Gateway-route as OutOfSync even when
    # the rendered target matches the live object. Telling compare to disregard
    # field-manager ownership for argocd-server silences that phantom drift.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      managedFieldsManagers: [argocd-server]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
