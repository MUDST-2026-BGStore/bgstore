apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: { name: keycloak-postgresql }
spec:
  instances: 3
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret: { name: keycloak-database }
  storage: { size: 10Gi }
  monitoring: { enablePodMonitor: true }
# The keycloak-database ExternalSecret (AWS Secrets Manager, key
# environments/production/keycloak-database) is intentionally not present yet:
# it requires the ClusterSecretStore named `bgstore` with IRSA access to AWS
# Secrets Manager (see docs/runbooks/deployment.md, provider decisions). The
# keycloak-database secret exists as a manual secret in the meantime and CNPG
# owns it. Re-add the ExternalSecret when the store is provisioned.
