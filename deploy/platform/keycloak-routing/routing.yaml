# Keycloak is served through the shared public Gateway
# (deploy/platform/public-gateway) rather than its own Gateway: the dev
# cluster's ServiceLB can only bind host ports 80/443 once.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: keycloak, namespace: keycloak }
spec:
  parentRefs:
    - { name: public, namespace: gateway }
  hostnames: [auth.devopsandbox.chanakanlabs.com]
  rules:
    - backendRefs: [{ name: keycloakx-http, port: 80 }]
