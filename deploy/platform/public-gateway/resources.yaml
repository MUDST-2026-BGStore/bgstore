apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: eg }
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: public, namespace: gateway }
spec:
  gatewayClassName: eg
  listeners:
    # Plain HTTP listener for ACME HTTP-01 challenges (cert-manager solver
    # attaches its temporary HTTPRoutes here).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: All } }
    - name: bgstore-dev
      protocol: HTTPS
      port: 443
      hostname: bgstore.devopsandbox.chanakanlabs.com
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: bgstore-dev-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: keycloak
      protocol: HTTPS
      port: 443
      hostname: auth.devopsandbox.chanakanlabs.com
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: keycloak-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: argocd
      protocol: HTTPS
      port: 443
      hostname: argocd.devopsandbox.chanakanlabs.com
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: argocd-tls }]
      allowedRoutes: { namespaces: { from: All } }
    - name: grafana
      protocol: HTTPS
      port: 443
      hostname: observe.devopsandbox.chanakanlabs.com
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: grafana-tls }]
      allowedRoutes: { namespaces: { from: All } }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: bgstore-dev-tls, namespace: gateway }
spec:
  secretName: bgstore-dev-tls
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
  dnsNames: [bgstore.devopsandbox.chanakanlabs.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: keycloak-tls, namespace: gateway }
spec:
  secretName: keycloak-tls
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
  dnsNames: [auth.devopsandbox.chanakanlabs.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: argocd-tls, namespace: gateway }
spec:
  secretName: argocd-tls
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
  dnsNames: [argocd.devopsandbox.chanakanlabs.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: grafana-tls, namespace: gateway }
spec:
  secretName: grafana-tls
  issuerRef: { name: letsencrypt-production, kind: ClusterIssuer }
  dnsNames: [observe.devopsandbox.chanakanlabs.com]
