# Grafana (from kube-prometheus-stack) is served through the shared public
# Gateway (deploy/platform/public-gateway) like the other platform UIs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: grafana, namespace: observability }
spec:
  parentRefs:
    - { name: public, namespace: gateway }
  hostnames: [observe.devopsandbox.chanakanlabs.com]
  rules:
    - backendRefs: [{ name: kube-prometheus-stack-grafana, port: 80 }]
