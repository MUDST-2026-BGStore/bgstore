apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: theparlor-dev
resources:
  - ../../base
  - ../../base/postgres
  - ../../base/valkey
  - namespace.yaml
  - ingress.yaml
labels:
  - pairs:
      theparlor.io/env: dev
      app.kubernetes.io/part-of: theparlor
patches:
  - path: config.yaml
images:
  - name: ghcr.io/theparlor/theparlor-api
    newTag: dev
  - name: ghcr.io/theparlor/theparlor-web
    newTag: dev
replicas:
  - name: api
    count: 1
  - name: web
    count: 1
