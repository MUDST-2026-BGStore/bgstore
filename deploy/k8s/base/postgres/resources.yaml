apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10-keycloak.sql: CREATE DATABASE keycloak;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, name: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_DB, value: theparlor }
            - name: POSTGRES_USER
              valueFrom:
                {
                  secretKeyRef: { name: theparlor-runtime, key: POSTGRES_USER },
                }
            - name: POSTGRES_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: theparlor-runtime, key: POSTGRES_PASSWORD },
                }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          readinessProbe:
            exec:
              {
                command:
                  [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'],
              }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: keycloak } }
      ports: [{ port: 5432, protocol: TCP }]
