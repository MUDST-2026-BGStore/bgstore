openapi: 3.0.3
info:
  title: BGStore API
  version: 0.1.0
  description: Contract for the BGStore management platform.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Hello
    description: Walking-skeleton operations.
  - name: Identity
    description: The authenticated BGStore user context and client onboarding.
paths:
  /hello:
    get:
      tags: [Hello]
      operationId: getHello
      summary: Verify the authenticated application path.
      responses:
        '200':
          description: The API and database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated BGStore user context.
      responses:
        '200':
          description: The cookie-backed user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/client-profile:
    put:
      tags: [Identity]
      operationId: completeClientProfile
      summary: Complete the authenticated client's required profile data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteClientProfileRequest'
      responses:
        '200':
          description: The completed client profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bgstore-session
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    OnboardingRequired:
      description: The client must complete onboarding before using this endpoint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    HelloResponse:
      type: object
      additionalProperties: false
      required: [message, service, database]
      properties:
        message:
          type: string
          example: Hello, BGStore!
        service:
          type: string
          enum: [bgstore-api]
        database:
          type: string
          enum: [connected]
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    ApplicationRole:
      type: string
      enum: [CLIENT, STAFF, MANAGER]
    ClientProfile:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        phone:
          type: string
          description: Phone number normalized to E.164 format.
          example: '+66812345678'
        completed:
          type: boolean
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        [
          subject,
          username,
          email,
          firstName,
          lastName,
          roles,
          onboardingRequired,
        ]
      properties:
        subject:
          type: string
          description: Immutable external identity subject.
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationRole'
        clientProfile:
          allOf:
            - $ref: '#/components/schemas/ClientProfile'
          nullable: true
        onboardingRequired:
          type: boolean
    CompleteClientProfileRequest:
      type: object
      additionalProperties: false
      required: [countryCode, phoneNumber]
      properties:
        countryCode:
          type: string
          description: International dialing prefix in E.164 form.
          pattern: '^\+[1-9][0-9]{0,3}$'
          example: '+66'
        phoneNumber:
          type: string
          description: National phone number, entered without the country code.
          minLength: 4
          maxLength: 15
          pattern: '^[0-9][0-9() .-]*$'
          example: '081 234 5678'
