openapi: 3.0.3
info:
  title: BGStore API
  version: 0.2.0
  description: Contract for the BGStore management platform.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Hello
    description: Walking-skeleton operations.
  - name: Identity
    description: The authenticated BGStore user context and client onboarding.
  - name: Branches
    description: Store branch directory.
  - name: Games
    description: Game catalogue and per-branch stock.
  - name: Tables
    description: Store table inventory and operational status management.
  - name: Reservations
    description: Client table reservation history and cancellation.
paths:
  /hello:
    get:
      tags: [Hello]
      operationId: getHello
      summary: Verify the authenticated application path.
      responses:
        '200':
          description: The API and database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated BGStore user context.
      responses:
        '200':
          description: The cookie-backed user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/client-profile:
    put:
      tags: [Identity]
      operationId: completeClientProfile
      summary: Complete the authenticated client's required profile data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteClientProfileRequest'
      responses:
        '200':
          description: The completed client profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /clients:
    get:
      tags: [Identity]
      operationId: listClients
      summary: Search registered clients for a staff-created reservation.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        '200':
          description: Registered client summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /branches:
    get:
      tags: [Branches]
      operationId: listBranches
      summary: List the store branches games can be stocked at.
      description: >-
        Public, so a guest can choose where to visit before signing in. A
        signed-in client still has to finish onboarding first.
      security:
        - {}
        - cookieAuth: []
      responses:
        '200':
          description: The branch directory, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
    post:
      tags: [Branches]
      operationId: createBranch
      summary: Create a store branch.
      description: >-
        Manager-only administrative action. Staff may read the branch directory
        for operational work, but only managers can add a location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: The created branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /games:
    get:
      tags: [Games]
      operationId: listGames
      summary: List games with their stock roll-up.
      description: >-
        Copies and availability are summed over the branches the filter selects.
        `stats` and `page.totalElements` describe the whole filtered set, not the
        returned page.
      parameters:
        - name: branchId
          in: query
          required: false
          description: Restrict stock figures and results to one branch.
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameCategory'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GameAvailability'
        - name: lifecycle
          in: query
          required: false
          description: >-
            Restrict results to active or retired games. The client catalogue
            asks for `active` so a customer never browses a game the store no
            longer offers; the inventory leaves it unset to see both.
          schema:
            $ref: '#/components/schemas/GameLifecycle'
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive match on either published title, so a Thai title is
            found by typing Thai and an English one by typing English.
          schema:
            type: string
            maxLength: 120
        - name: locale
          in: query
          required: false
          description: >-
            Language the page is ordered by. Rows are sorted on the title this
            locale resolves to under the `LocalizedTitle` fallback rule, so the
            order matches what a reader in that locale sees.
          schema:
            $ref: '#/components/schemas/CatalogueLocale'
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The matching page of games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    post:
      tags: [Games]
      operationId: createGame
      summary: Add a game to the catalogue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRequest'
      responses:
        '201':
          description: The created game.
          headers:
            Location:
              description: URL of the created game.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Games]
      operationId: getGame
      summary: Read one game with its per-branch stock.
      responses:
        '200':
          description: The requested game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
    put:
      tags: [Games]
      operationId: updateGame
      summary: Replace a game and its per-branch stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameRequest'
      responses:
        '200':
          description: The updated game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
    delete:
      tags: [Games]
      operationId: retireGame
      summary: Retire a game.
      description: >-
        Retiring is the inventory list's delete action. The record is kept so
        past play sessions keep referring to a real game; a retired game still
        appears in the inventory under the `retired` status and can be brought
        back by updating it with `lifecycle: active`.
      responses:
        '204':
          description: The game is retired.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
  /tables:
    get:
      tags: [Tables]
      operationId: listTables
      summary: List store tables with optional filtering and pagination.
      parameters:
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: zone
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TableStatus'
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A paginated list of tables matching the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tables]
      operationId: createTable
      summary: Create a new store table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: The created table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tables/{tableId}:
    parameters:
      - name: tableId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Tables]
      operationId: getTable
      summary: Get details of a single store table by ID.
      responses:
        '200':
          description: The table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tables]
      operationId: updateTable
      summary: Update an existing store table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
      responses:
        '200':
          description: The updated table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tables]
      operationId: deleteTable
      summary: Delete a store table.
      responses:
        '204':
          description: The table was successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /floor-overview:
    get:
      tags: [Reservations]
      operationId: getFloorOverview
      summary: Staff view of every table's status and upcoming reserved slots.
      description: >-
        The status counts cover the whole floor (optionally one branch) and
        ignore the status and search filters, which only narrow the rows.
      parameters:
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TableStatus'
        - name: search
          in: query
          required: false
          description: Matches part of a table name, or a table id exactly.
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: The floor status counts and one page of tables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorOverviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /staff/branch-assignments:
    get:
      tags: [Identity]
      operationId: listStaffBranchAssignments
      summary: List staff branch assignments for manager administration.
      responses:
        '200':
          description: Staff identities and their assigned branches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBranchAssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /staff/branch-assignments/{staffSubject}:
    put:
      tags: [Identity]
      operationId: replaceStaffBranchAssignments
      summary: Replace the branches assigned to a staff member.
      parameters:
        - name: staffSubject
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: '#/components/schemas/ReplaceStaffBranchAssignmentsRequest',
              }
      responses:
        '200':
          description: Updated assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBranchAssignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reservations:
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations for the authenticated client with optional status filter and pagination.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 4
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A paginated list of reservations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Create a table reservation for the current client or a client selected by staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: The created reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The selected table is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /reservations/availability:
    get:
      tags: [Reservations]
      operationId: getReservationAvailability
      summary: List tables suitable for a reservation interval.
      parameters:
        - name: branch
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: startTime
          in: query
          required: true
          schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        - name: endTime
          in: query
          required: true
          schema: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 13 }
      responses:
        '200':
          description: Suitable tables and whether each is currently available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationAvailabilityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reservations/{reservationId}:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Get details of a single reservation by ID.
      responses:
        '200':
          description: The reservation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations/{reservationId}/cancel:
    parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel an upcoming reservation.
      responses:
        '200':
          description: The cancelled reservation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bgstore-session
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    OnboardingRequired:
      description: The client must complete onboarding before using this endpoint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableContent:
      description: The payload is well-formed but violates a rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  schemas:
    HelloResponse:
      type: object
      additionalProperties: false
      required: [message, service, database]
      properties:
        message:
          type: string
          example: Hello, BGStore!
        service:
          type: string
          enum: [bgstore-api]
        database:
          type: string
          enum: [connected]
    ApplicationRole:
      type: string
      enum: [CLIENT, STAFF, MANAGER]
    StaffBranchAssignment:
      type: object
      additionalProperties: false
      required: [staffSubject, displayName, branchIds]
      properties:
        staffSubject: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        branchIds:
          type: array
          items: { type: string, format: uuid }
    StaffBranchAssignmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffBranchAssignment' }
    ReplaceStaffBranchAssignmentsRequest:
      type: object
      additionalProperties: false
      required: [branchIds]
      properties:
        branchIds:
          type: array
          items: { type: string, format: uuid }
    ClientSummary:
      type: object
      additionalProperties: false
      required: [subject, displayName]
      properties:
        subject: { type: string }
        displayName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string, nullable: true }
    ClientListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClientSummary' }
    ClientProfile:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        phone:
          type: string
          description: Thai mobile number in E.164 format.
          example: '+66812345678'
        completed:
          type: boolean
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        [
          subject,
          username,
          email,
          firstName,
          lastName,
          roles,
          onboardingRequired,
        ]
      properties:
        subject:
          type: string
          description: Immutable external identity subject.
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationRole'
        clientProfile:
          allOf:
            - $ref: '#/components/schemas/ClientProfile'
          nullable: true
        onboardingRequired:
          type: boolean
    CompleteClientProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, countryCode, phoneNumber]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Client's given name, collected during registration or onboarding.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Client's family name, collected during registration or onboarding.
        countryCode:
          type: string
          description: International dialing prefix in E.164 form.
          pattern: '^\+[1-9][0-9]{0,3}$'
          example: '+66'
        phoneNumber:
          type: string
          description: National phone number, entered without the country code.
          minLength: 4
          maxLength: 15
          pattern: '^[0-9][0-9() .-]*$'
          example: '081 234 5678'
    Branch:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Central Rama II
        address:
          type: string
          nullable: true
          description: The postal address guests are shown. Null until the store records one.
          example: 160 ถ. พระรามที่ 2 แขวงแสมดำ เขตบางขุนเทียน กรุงเทพฯ 10150
        opensAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: >-
            Opening time, Bangkok local time. Null, together with `closesAt`,
            until the store records its hours.
          example: '09:00'
        closesAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Closing time, Bangkok local time. Null exactly when `opensAt` is.
          example: '19:00'
        phone:
          type: string
          nullable: true
          maxLength: 32
          description: Public branch phone number. Null until the store records one.
          example: '+6621234567'
        status:
          $ref: '#/components/schemas/BranchStatus'
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
          description: WGS84 latitude used for distance estimates. Null until recorded.
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
          description: WGS84 longitude used for distance estimates. Null until recorded.
    BranchStatus:
      type: string
      description: Whether the branch currently accepts bookings.
      enum: [ACTIVE, INACTIVE]
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The unique display name of the branch.
        address:
          type: string
          nullable: true
          maxLength: 300
          description: The postal address guests are shown.
        opensAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Opening time in Bangkok local time.
        closesAt:
          type: string
          nullable: true
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Closing time in Bangkok local time.
    BranchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    CatalogueLocale:
      type: string
      description: >-
        A language the catalogue publishes metadata in. `en` is the canonical
        entry every game carries; `th` is the Thai translation.
      enum: [en, th]
      default: en
    LocalizedTitle:
      type: object
      additionalProperties: false
      description: >-
        A game title in the languages the catalogue publishes.


        Fallback rule: to render in a locale, take that locale's value when it
        is present and not blank, and fall back to `en` otherwise. `en` is
        required, so a title always resolves to something.
      required: [en]
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 120
        th:
          type: string
          nullable: true
          maxLength: 120
    LocalizedDescription:
      type: object
      additionalProperties: false
      description: >-
        A short description in the languages the catalogue publishes. Both
        languages are optional; the `LocalizedTitle` fallback rule applies, and
        here it can resolve to nothing when neither language carries text.
      properties:
        en:
          type: string
          nullable: true
          maxLength: 160
        th:
          type: string
          nullable: true
          maxLength: 160
    LocalizedGuideText:
      type: object
      additionalProperties: false
      description: >-
        A paragraph of how-to-play text. Both languages are optional; the
        `LocalizedTitle` fallback rule applies, and it can resolve to nothing.
      properties:
        en:
          type: string
          nullable: true
          maxLength: 600
        th:
          type: string
          nullable: true
          maxLength: 600
    GameImageUrl:
      type: string
      description: >-
        Absolute http(s) address of a game photo. The browser loads it as an
        image; the API stores the address and never fetches it.
      maxLength: 2048
      pattern: '^https?://\S+$'
      example: https://cdn.example.com/games/exploding-kittens.jpg
    GameGuideStep:
      type: object
      additionalProperties: false
      description: One numbered step of the "how to play" walkthrough.
      required: [title]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        body:
          allOf:
            - $ref: '#/components/schemas/LocalizedGuideText'
          nullable: true
    GameGuide:
      type: object
      additionalProperties: false
      description: >-
        What a customer reads before arriving at the store: the goal, a note on
        player count, the components in the box, and a short walkthrough. Every
        part is optional; an empty guide has no text and no steps.
      required: [steps]
      properties:
        goal:
          allOf:
            - $ref: '#/components/schemas/LocalizedGuideText'
          nullable: true
        players:
          allOf:
            - $ref: '#/components/schemas/LocalizedGuideText'
          nullable: true
          description: >-
            Replaces the plain player range when set, for counts that need a
            qualifier such as "2–5 (up to 10 with the Party Pack)".
        equipment:
          allOf:
            - $ref: '#/components/schemas/LocalizedGuideText'
          nullable: true
        steps:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/GameGuideStep'
    GameCategory:
      type: string
      description: Catalogue category. Values map to `games.category.*` messages.
      enum: [family, card, party, strategy]
    GameLifecycle:
      type: string
      description: Whether the game is still offered in store.
      enum: [active, retired]
    GameAvailability:
      type: string
      description: >-
        Display status. `retired` reflects the lifecycle; the other three are
        derived from copies and the copies currently out on a session. Values
        map to `games.status.*` messages.
      enum: [available, allCopiesOut, retired, notStocked]
    BranchStock:
      type: object
      additionalProperties: false
      required: [branchId, branchName, copies, available, inUse, status]
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        copies:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        inUse:
          type: integer
          format: int32
          minimum: 0
        status:
          $ref: '#/components/schemas/GameAvailability'
    GameSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          category,
          minPlayers,
          maxPlayers,
          branchCount,
          copies,
          available,
          status,
        ]
      properties:
        id:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        category:
          $ref: '#/components/schemas/GameCategory'
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        playTimeMinutes:
          type: integer
          format: int32
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
          description: The game's first photo, for list thumbnails. Null when it has none.
        branchName:
          type: string
          nullable: true
          description: >-
            The branch this row's figures come from, when they come from exactly
            one branch. Null when the game is stocked at several branches and no
            branch filter is applied.
        branchCount:
          type: integer
          format: int32
          minimum: 0
        copies:
          type: integer
          format: int32
          minimum: 0
        available:
          type: integer
          format: int32
          minimum: 0
        status:
          $ref: '#/components/schemas/GameAvailability'
    PageMeta:
      type: object
      additionalProperties: false
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    GameStats:
      type: object
      additionalProperties: false
      description: Totals over the whole filtered set, before pagination.
      required: [titles, availableNow, inUse]
      properties:
        titles:
          type: integer
          format: int64
          minimum: 0
        availableNow:
          type: integer
          format: int64
          minimum: 0
        inUse:
          type: integer
          format: int64
          minimum: 0
    GameListResponse:
      type: object
      additionalProperties: false
      required: [items, page, stats]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
        stats:
          $ref: '#/components/schemas/GameStats'
    GameDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          category,
          minPlayers,
          maxPlayers,
          tags,
          imageUrls,
          guide,
          lifecycle,
          status,
          addedAt,
          totalCopies,
          branchCount,
          stock,
        ]
      properties:
        id:
          type: string
          format: uuid
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        description:
          allOf:
            - $ref: '#/components/schemas/LocalizedDescription'
          nullable: true
        category:
          $ref: '#/components/schemas/GameCategory'
        minPlayers:
          type: integer
          format: int32
        maxPlayers:
          type: integer
          format: int32
        playTimeMinutes:
          type: integer
          format: int32
          nullable: true
        difficulty:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          description: Game photos in display order; the first is the cover.
          items:
            type: string
        guide:
          $ref: '#/components/schemas/GameGuide'
        lifecycle:
          $ref: '#/components/schemas/GameLifecycle'
        status:
          $ref: '#/components/schemas/GameAvailability'
        addedAt:
          type: string
          format: date-time
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true
          description: Set by the play-session module; null until a session used this game.
        totalCopies:
          type: integer
          format: int32
          minimum: 0
        branchCount:
          type: integer
          format: int32
          minimum: 0
          description: Branches holding at least one copy.
        stock:
          type: array
          description: One entry per branch in the directory, including branches with no copies.
          items:
            $ref: '#/components/schemas/BranchStock'
    BranchCopiesRequest:
      type: object
      additionalProperties: false
      required: [branchId, copies]
      properties:
        branchId:
          type: string
          format: uuid
        copies:
          type: integer
          format: int32
          minimum: 0
          maximum: 999
    GameRequest:
      type: object
      additionalProperties: false
      required: [title, category, minPlayers, maxPlayers]
      properties:
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        description:
          allOf:
            - $ref: '#/components/schemas/LocalizedDescription'
          nullable: true
        category:
          $ref: '#/components/schemas/GameCategory'
        minPlayers:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        maxPlayers:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        playTimeMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 600
          nullable: true
        difficulty:
          type: string
          maxLength: 60
          nullable: true
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 40
        imageUrls:
          type: array
          description: Game photos in display order. Left out, the game keeps no photos.
          maxItems: 8
          items:
            $ref: '#/components/schemas/GameImageUrl'
        guide:
          allOf:
            - $ref: '#/components/schemas/GameGuide'
          nullable: true
          description: Left out or null, the game keeps no how-to-play content.
        lifecycle:
          $ref: '#/components/schemas/GameLifecycle'
        copies:
          type: array
          description: >-
            Per-branch copy counts. Branches left out keep no copies; on update,
            branches left out are cleared.
          items:
            $ref: '#/components/schemas/BranchCopiesRequest'
    TableStatus:
      type: string
      enum: [Available, Reserved, Occupied, Unavailable]
    TableShape:
      type: string
      enum: [Round, Square, Oval, Rectangle]
    TableResponse:
      type: object
      additionalProperties: false
      required:
        [id, name, branch, capacity, shape, status, active, zone, lastUpdated]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        active:
          type: boolean
        zone:
          type: string
          minLength: 1
          maxLength: 100
        lastUpdated:
          type: string
          format: date-time
    TableListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableResponse'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    CreateTableRequest:
      type: object
      additionalProperties: false
      required: [name, branch, capacity, shape, status, active, zone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        active:
          type: boolean
        zone:
          type: string
          minLength: 1
          maxLength: 100
    UpdateTableRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTableRequest'
    FloorStatusCounts:
      type: object
      additionalProperties: false
      required: [available, occupied, reserved]
      properties:
        available:
          type: integer
          minimum: 0
        occupied:
          type: integer
          minimum: 0
        reserved:
          type: integer
          minimum: 0
    ReservedSlot:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    FloorTableResponse:
      type: object
      additionalProperties: false
      required: [id, name, capacity, shape, status, reservedSlots]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        capacity:
          type: integer
          minimum: 1
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        reservedSlots:
          type: array
          description: Slots that have not ended yet, soonest first.
          items:
            $ref: '#/components/schemas/ReservedSlot'
    FloorOverviewResponse:
      type: object
      additionalProperties: false
      required: [counts, items, total, page, pageSize, totalPages]
      properties:
        counts:
          $ref: '#/components/schemas/FloorStatusCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FloorTableResponse'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    ReservationStatus:
      type: string
      enum: [Reserved, CheckedIn, Completed, Cancelled]
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [branch, date, startTime, endTime, partySize, tableId]
      properties:
        clientSubject:
          type: string
          description: Existing registered client selected by staff; omit for a walk-in client.
        branch: { type: string, minLength: 1 }
        date: { type: string, format: date }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        partySize: { type: integer, minimum: 1, maximum: 13 }
        tableId: { type: integer, format: int64 }
        customerName: { type: string, minLength: 1, maxLength: 255 }
        phoneNumber: { type: string, minLength: 1, maxLength: 64 }
    ReservationAvailabilityTable:
      type: object
      additionalProperties: false
      required: [id, name, capacity, available]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        capacity: { type: integer }
        available: { type: boolean }
    ReservationAvailabilityResponse:
      type: object
      additionalProperties: false
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: '#/components/schemas/ReservationAvailabilityTable' }
    ReservationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - date
        - timeSlot
        - partySize
        - tableId
        - tableName
        - seats
        - ratePerHour
        - status
        - customerName
        - phoneNumber
        - checkInTime
        - actualCheckOut
        - overtimeMinutes
        - totalPrice
        - canCancel
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
        timeSlot:
          type: string
        partySize:
          type: integer
        tableId:
          type: integer
          format: int64
        tableName:
          type: string
        seats:
          type: integer
        ratePerHour:
          type: integer
        status:
          $ref: '#/components/schemas/ReservationStatus'
        customerName:
          type: string
        phoneNumber:
          type: string
        checkInTime:
          type: string
        actualCheckOut:
          type: string
        overtimeMinutes:
          type: integer
        totalPrice:
          type: integer
        canCancel:
          type: boolean
        thumbnailUrl:
          type: string
    ReservationListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationResponse'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Dotted path of the rejected property, for example `copies[0].copies`.
        message:
          type: string
          description: >-
            Message key the browser resolves through `games.form.errors.*`,
            falling back to the text itself when no message exists.
      example:
        field: title.en
        message: required
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
