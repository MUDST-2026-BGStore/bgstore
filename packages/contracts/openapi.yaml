openapi: 3.0.3
info:
  title: BGStore API
  version: 0.1.0
  description: Contract for the BGStore management platform.
  license:
    name: Apache-2.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Hello
    description: Walking-skeleton operations.
  - name: Identity
    description: The authenticated BGStore user context and client onboarding.
  - name: Tables
    description: Store table inventory and operational status management.
paths:
  /hello:
    get:
      tags: [Hello]
      operationId: getHello
      summary: Verify the authenticated application path.
      responses:
        '200':
          description: The API and database are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '428':
          $ref: '#/components/responses/OnboardingRequired'
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated BGStore user context.
      responses:
        '200':
          description: The cookie-backed user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/client-profile:
    put:
      tags: [Identity]
      operationId: completeClientProfile
      summary: Complete the authenticated client's required profile data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteClientProfileRequest'
      responses:
        '200':
          description: The completed client profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tables:
    get:
      tags: [Tables]
      operationId: listTables
      summary: List store tables with optional filtering and pagination.
      parameters:
        - name: branch
          in: query
          required: false
          schema:
            type: string
        - name: zone
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TableStatus'
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A paginated list of tables matching the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tables]
      operationId: createTable
      summary: Create a new store table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: The created table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tables/{tableId}:
    get:
      tags: [Tables]
      operationId: getTable
      summary: Get details of a single store table by ID.
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tables]
      operationId: updateTable
      summary: Update an existing store table.
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
      responses:
        '200':
          description: The updated table record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tables]
      operationId: deleteTable
      summary: Delete a store table.
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The table was successfully deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bgstore-session
  responses:
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: The authenticated user is not allowed to perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    OnboardingRequired:
      description: The client must complete onboarding before using this endpoint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    HelloResponse:
      type: object
      additionalProperties: false
      required: [message, service, database]
      properties:
        message:
          type: string
          example: Hello, BGStore!
        service:
          type: string
          enum: [bgstore-api]
        database:
          type: string
          enum: [connected]
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    ApplicationRole:
      type: string
      enum: [CLIENT, STAFF, MANAGER]
    ClientProfile:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        phone:
          type: string
          description: Thai mobile number in E.164 format.
          example: '+66812345678'
        completed:
          type: boolean
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        [
          subject,
          username,
          email,
          firstName,
          lastName,
          roles,
          onboardingRequired,
        ]
      properties:
        subject:
          type: string
          description: Immutable external identity subject.
        username:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationRole'
        clientProfile:
          allOf:
            - $ref: '#/components/schemas/ClientProfile'
          nullable: true
        onboardingRequired:
          type: boolean
    CompleteClientProfileRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          description: A Thai mobile number, with or without the +66 country code.
          minLength: 10
          maxLength: 13
    TableStatus:
      type: string
      enum: [Available, Reserved, Occupied, Unavailable]
    TableShape:
      type: string
      enum: [Round, Square, Oval, Rectangle]
    TableResponse:
      type: object
      additionalProperties: false
      required:
        [id, name, branch, capacity, shape, status, active, zone, lastUpdated]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        active:
          type: boolean
        zone:
          type: string
          minLength: 1
          maxLength: 100
        lastUpdated:
          type: string
          format: date-time
    TableListResponse:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableResponse'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
    CreateTableRequest:
      type: object
      additionalProperties: false
      required: [name, branch, capacity, shape, status, active, zone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        active:
          type: boolean
        zone:
          type: string
          minLength: 1
          maxLength: 100
    UpdateTableRequest:
      type: object
      additionalProperties: false
      required: [name, branch, capacity, shape, status, active, zone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        branch:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
          maximum: 100
        shape:
          $ref: '#/components/schemas/TableShape'
        status:
          $ref: '#/components/schemas/TableStatus'
        active:
          type: boolean
        zone:
          type: string
          minLength: 1
          maxLength: 100
