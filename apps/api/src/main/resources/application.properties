spring.application.name=bgstore-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bgstore}
spring.datasource.username=${POSTGRES_USER:bgstore}
spring.datasource.password=${POSTGRES_PASSWORD:bgstore-local-only}

# Flyway owns schema evolution; JPA validates that mappings still match it.
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:bgstore-local-only}
spring.session.redis.namespace=bgstore:session
spring.session.timeout=8h

# Browser-facing URL; the BFF uses the internal URL below for server-side calls.
bgstore.security.keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}

spring.security.oauth2.client.registration.bgstore.provider=bgstore
spring.security.oauth2.client.registration.bgstore.client-id=bgstore-web
spring.security.oauth2.client.registration.bgstore.client-secret=${KEYCLOAK_CLIENT_SECRET:bgstore-local-client-secret}
spring.security.oauth2.client.registration.bgstore.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.bgstore.redirect-uri={baseUrl}/auth/callback/{registrationId}
spring.security.oauth2.client.registration.bgstore.scope=openid,profile,email
spring.security.oauth2.client.provider.bgstore.authorization-uri=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/auth
spring.security.oauth2.client.provider.bgstore.token-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/token
spring.security.oauth2.client.provider.bgstore.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/certs
spring.security.oauth2.client.provider.bgstore.user-info-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.bgstore.user-name-attribute=preferred_username

# Unhandled failures answer with RFC 9457 problem details, so every error the
# API returns matches the ProblemDetail schema the contract publishes.
spring.mvc.problemdetails.enabled=true

server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
# Keep the production __Host- cookie valid: it must be scoped to the root path.
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:bgstore-session}
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.logging.export.otlp.enabled=true
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs

spring.threads.virtual.enabled=true
