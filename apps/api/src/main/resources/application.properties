spring.application.name=bgstore-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bgstore}
spring.datasource.username=${POSTGRES_USER:bgstore}
spring.datasource.password=${POSTGRES_PASSWORD:bgstore-local-only}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:bgstore-local-only}
spring.session.redis.namespace=bgstore:session
spring.session.timeout=8h

spring.security.oauth2.client.registration.keycloak.client-id=bgstore-web
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:bgstore-local-client-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_PUBLIC_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_INTERNAL_URL:http://localhost:8081}/realms/bgstore/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:bgstore-session}
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs

spring.threads.virtual.enabled=true
