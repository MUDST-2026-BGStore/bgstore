name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # 4 vCPU/16GB class: pnpm install + Gradle build/check.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            apps/api/build/reports
            apps/web/test-output

  browser:
    # Real-stack Chromium plus isolated cross-browser and mobile journeys.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24.19.0, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: .agents/bin/verify full-stack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-e2e-reports
          if-no-files-found: warn
          path: |
            apps/web-e2e/test-output/playwright/report
            apps/web-e2e/test-output/playwright/output
            apps/web-e2e/test-output/coverage
            apps/api/build/reports/jacoco/e2e

  delivery-manifests:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - run: helm lint deploy/charts/bgstore
      - name: Render every environment
        run: |
          for values_file in deploy/environments/*/values.yaml; do
            environment=$(basename "$(dirname "$values_file")")
            helm template bgstore deploy/charts/bgstore \
              --namespace "bgstore-${environment}" \
              --values "$values_file" \
              > "/tmp/bgstore-${environment}.yaml"
          done
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

  compose:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --env-file .env.example config --quiet
