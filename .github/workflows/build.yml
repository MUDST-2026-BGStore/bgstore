name: Build trunk images

# Dev delivery: every push to main builds the api/web images under a
# content-addressed `main-<sha>` tag. The bgstore ApplicationSet pins that same
# tag into the dev environment, so a merge to main is a deployment, not just a
# build. Releases (tags) do not build from here — they are signed, versioned
# builds in publish.yml.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
  workflow_dispatch:
    # Manual rebuild; `ref` selects the main commit to build.
    inputs:
      ref:
        description: Commit on main to build
        required: false
        default: main

concurrency:
  group: dev-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: tag
        run: echo "sha=main-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-web:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Report built tags
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: echo "Built ghcr.io/mudst-2026-bgstore/{bgstore-api,bgstore-web}:$TAG" >> "$GITHUB_STEP_SUMMARY"
