name: Build trunk images

# Dev delivery: every push to main builds the api/web images under a
# content-addressed `main-<sha>` tag, then a pull request bumps
# deploy/environments/dev/values.yaml to it — merging that PR deploys dev.
# Releases (tags) are separate signed builds in publish.yml.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
  workflow_dispatch:
    # Manual rebuild; `ref` selects the main commit to build.
    inputs:
      ref:
        description: Commit on main to build
        required: false
        default: main

concurrency:
  group: dev-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: tag
        run: echo "sha=main-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-web:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Report built tags
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: echo "Built ghcr.io/mudst-2026-bgstore/{bgstore-api,bgstore-web}:$TAG" >> "$GITHUB_STEP_SUMMARY"

  # Bump dev to the freshly built tag through a pull request (the repo requires
  # pull requests on main). Merging the PR is the deployment; Argo CD picks up
  # the changed values file and rolls the dev pods onto the new image.
  bump-dev:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: mikefarah/yq@v4.47.2
        with:
          cmd: >-
            yq -i '.images.api.tag = strenv(TAG) |
            .images.web.tag = strenv(TAG)'
            deploy/environments/dev/values.yaml
        env:
          TAG: main-${{ github.sha }}
      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          base: main
          branch: chore/dev-image-bump
          delete-branch: true
          commit-message: 'chore(deploy): dev -> main-${{ github.sha }}'
          title: 'chore(deploy): dev -> main-${{ github.sha }}'
          body: |
            Bumps the dev environment to the trunk-built image for ${{ github.sha }}.

            Built by the trunk-images workflow. Merging deploys to dev (ADR-0008).
          labels: deployment
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        # Wait for the branch-protection checks on the PR, then merge. Auto-merge
        # would need the repo-wide "allow auto-merge" setting; polling the merge
        # state keeps the whole loop in one workflow run. BLOCKED means required
        # checks are still pending; DIRTY/UNSTABLE mean a real failure.
        run: |
          for _ in $(seq 1 40); do
            state="$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)"
            case "$state" in
              CLEAN|HAS_HOOKS) break ;;
              DIRTY|UNSTABLE)
                echo "::error::PR #$PR cannot merge (mergeStateStatus=$state)"
                gh pr checks "$PR" || true
                exit 1 ;;
              *) sleep 30 ;;
            esac
          done
          gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus
          gh pr merge "$PR" --squash --delete-branch
