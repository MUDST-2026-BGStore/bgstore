name: Build trunk images

# Dev delivery: every push to main builds the api/web images under a
# content-addressed `main-<sha>` tag, then a pull request bumps
# deploy/environments/dev/values.yaml to it — merging that PR deploys dev.
# Releases (tags) are separate signed builds in publish.yml.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'apps/api/Dockerfile'
      - 'apps/web/Dockerfile'
  workflow_dispatch:
    # Manual rebuild; `ref` selects the main commit to build.
    inputs:
      ref:
        description: Commit on main to build
        required: false
        default: main

concurrency:
  group: dev-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: tag
        run: echo "sha=main-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-api:${{ steps.tag.outputs.sha }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-web:${{ steps.tag.outputs.sha }}
      - name: Report built tags
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: echo "Built ghcr.io/mudst-2026-bgstore/{bgstore-api,bgstore-web}:$TAG" >> "$GITHUB_STEP_SUMMARY"

  # Bump dev to the freshly built tag through a pull request (the repo requires
  # pull requests on main). Merging the PR is the deployment; Argo CD picks up
  # the changed values file and rolls the dev pods onto the new image.
  bump-dev:
    needs: images
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: mikefarah/yq@v4.47.2
        with:
          cmd: >-
            yq -i '.images.api.tag = strenv(TAG) |
            .images.web.tag = strenv(TAG)'
            deploy/environments/dev/values.yaml
        env:
          TAG: main-${{ github.sha }}
      # yq re-emits flow mappings without the spacing Prettier requires, which
      # fails the required `quality` check; reformat the file after bumping.
      - run: npm exec --yes -- prettier@3.6.2 --write deploy/environments/dev/values.yaml
      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          base: main
          branch: chore/dev-image-bump
          delete-branch: true
          commit-message: 'chore(deploy): dev -> main-${{ github.sha }}'
          title: 'chore(deploy): dev -> main-${{ github.sha }}'
          body: |
            Bumps the dev environment to the trunk-built image for ${{ github.sha }}.

            Built by the trunk-images workflow. Merging deploys to dev (ADR-0008).
          labels: deployment
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          PR: ${{ steps.pr.outputs.pull-request-number }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
        # The bump PR is authored by github-actions, so GitHub requires a human
        # review before it can merge: the GITHUB_TOKEN cannot approve its own
        # PR and repo-wide auto-merge is off. The review is the deploy gate —
        # once checks are green, approve and squash-merge the PR and Argo CD
        # rolls the dev pods onto the new image.
        run: |
          echo "Dev deploy pending human merge: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Once its checks pass, approve the PR (unblocks the bot-authored review gate) and squash-merge it to deploy dev." >> "$GITHUB_STEP_SUMMARY"
