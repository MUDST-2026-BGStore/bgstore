name: Publish release

# A release is a promotion, not a rebuild trigger for dev: it produces
# signed, versioned multi-arch images (tag + latest) and records their
# digests in the release notes. Production deployment wiring does not
# exist yet (single devopsandbox node); when it does, extend this
# workflow or ADR-0008 with digest promotion.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and promote
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - id: api
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mudst-2026-bgstore/bgstore-api:${{ env.RELEASE_TAG }}
            ghcr.io/mudst-2026-bgstore/bgstore-api:latest
          sbom: true
          provenance: mode=max
      - id: web
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mudst-2026-bgstore/bgstore-web:${{ env.RELEASE_TAG }}
            ghcr.io/mudst-2026-bgstore/bgstore-web:latest
          sbom: true
          provenance: mode=max
      - id: keycloak
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: infra/keycloak/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-keycloak:${{ env.RELEASE_TAG }}
          sbom: true
          provenance: mode=max
      - name: Sign images with GitHub OIDC
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-api@${API_DIGEST}"
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-web@${WEB_DIGEST}"
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-keycloak@${KEYCLOAK_DIGEST}"
      - name: Record signed digests in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: |
          notes=$(mktemp)
          {
            echo '**Signed image digests**'
            echo
            echo "- bgstore-api: \`$API_DIGEST\`"
            echo "- bgstore-web: \`$WEB_DIGEST\`"
            echo "- bgstore-keycloak: \`$KEYCLOAK_DIGEST\`"
          } > "$notes"
          gh release edit "$RELEASE_TAG" --append-notes "$(cat "$notes")"
