name: Publish release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and promote
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mudst-2026-bgstore/bgstore-api:${{ env.RELEASE_TAG }}
            ghcr.io/mudst-2026-bgstore/bgstore-api:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mudst-2026-bgstore/bgstore-web:${{ env.RELEASE_TAG }}
            ghcr.io/mudst-2026-bgstore/bgstore-web:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - id: keycloak
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/keycloak/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-keycloak:${{ env.RELEASE_TAG }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
      - name: Sign images with GitHub OIDC
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          KEYCLOAK_DIGEST: ${{ steps.keycloak.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-api@${API_DIGEST}"
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-web@${WEB_DIGEST}"
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-keycloak@${KEYCLOAK_DIGEST}"
      - uses: mikefarah/yq@v4.47.2
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        with:
          cmd: >-
            yq -i '.images.api.digest = strenv(API_DIGEST) |
            .images.web.digest = strenv(WEB_DIGEST)'
            deploy/environments/production.yaml
      - name: Promote the Keycloak theme image
        env:
          KEYCLOAK_TAG: ${{ env.RELEASE_TAG }}
        run: |
          perl -0pi -e 's/image:\n          tag: [^\n]+/image:\n          repository: ghcr.io\/mudst-2026-bgstore\/bgstore-keycloak\n          tag: $ENV{KEYCLOAK_TAG}/' deploy/argocd/platform.yaml
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: release/${{ env.RELEASE_TAG }}-production
          commit-message: 'chore(deploy): promote ${{ env.RELEASE_TAG }}'
          title: 'chore(deploy): promote ${{ env.RELEASE_TAG }}'
          body: Promotes signed image digests produced by the release workflow.
          labels: deployment
