name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-api:${{ github.event.release.tag_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mudst-2026-bgstore/bgstore-web:${{ github.event.release.tag_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Sign images with GitHub OIDC
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-api@${API_DIGEST}"
          cosign sign --yes "ghcr.io/mudst-2026-bgstore/bgstore-web@${WEB_DIGEST}"
      - uses: mikefarah/yq@v4.47.2
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        with:
          cmd: >-
            yq -i '.images.api.digest = strenv(API_DIGEST) |
            .images.web.digest = strenv(WEB_DIGEST)'
            deploy/environments/production.yaml
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: release/${{ github.event.release.tag_name }}-production
          commit-message: 'chore(deploy): promote ${{ github.event.release.tag_name }}'
          title: 'chore(deploy): promote ${{ github.event.release.tag_name }}'
          body: Promotes signed image digests produced by the release workflow.
          labels: deployment
