name: bgstore

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bgstore}
      POSTGRES_USER: ${POSTGRES_USER:-bgstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bgstore-local-only}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-bgstore} -d ${POSTGRES_DB:-bgstore}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-alpine
    command:
      ['redis-server', '--requirepass', '${REDIS_PASSWORD:-bgstore-local-only}']
    ports:
      - '6379:6379'
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:-bgstore-local-only}',
          'ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local-only
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports:
      - '8081:8080'
    volumes:
      - ./infra/local/keycloak/bgstore-realm.json:/opt/keycloak/data/import/bgstore-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bgstore
      POSTGRES_USER: ${POSTGRES_USER:-bgstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bgstore-local-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bgstore-local-only}
      KEYCLOAK_PUBLIC_URL: http://localhost:8081
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-bgstore-local-client-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '4200:8080'
    depends_on:
      - api

  otel-collector:
    profiles: [observability, app]
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - tempo
      - loki

  prometheus:
    profiles: [observability, app]
    image: prom/prometheus:v3.13.0-distroless
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yaml',
        '--storage.tsdb.retention.time=7d',
      ]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'

  loki:
    profiles: [observability, app]
    image: grafana/loki:3.7.2
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'

  tempo:
    profiles: [observability, app]
    image: grafana/tempo:2.10.7
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'

  grafana:
    profiles: [observability, app]
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin-local-only
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  grafana-data:
  loki-data:
  postgres-data:
  prometheus-data:
  tempo-data:
