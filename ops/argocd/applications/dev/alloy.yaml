apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theparlor-dev-alloy
  namespace: argocd
  labels:
    app.kubernetes.io/name: theparlor
    app.kubernetes.io/part-of: theparlor
    theparlor.io/env: dev
spec:
  project: theparlor
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/ops/argocd/charts/values/alloy/dev.yaml
    - repoURL: https://github.com/REPLACE_ME/theparlor-new.git
      targetRevision: main
      ref: values
