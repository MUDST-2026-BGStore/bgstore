apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: theparlor-dev-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: theparlor
    app.kubernetes.io/part-of: theparlor
    theparlor.io/env: dev
spec:
  project: theparlor
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/ops/argocd/charts/values/kube-prometheus-stack/dev.yaml
    - repoURL: https://github.com/REPLACE_ME/theparlor-new.git
      targetRevision: main
      ref: values
